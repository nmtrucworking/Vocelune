<title id="title">Vocelune — Moon Flashcard Logo · Master Vector</title>
<desc id="desc">Editable vector reproduction: four beveled stacked cards in violet, royal blue, cyan and pearl white, crescent and star, two strokes and three cyan-to-indigo spark rays. All visible components are SVG paths and gradients.</desc>

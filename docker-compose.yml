services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vocelune
      POSTGRES_USER: vocelune
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocelune_local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocelune -d vocelune"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:
  redis_data:

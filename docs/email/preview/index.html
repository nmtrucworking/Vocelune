:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f1f3fa;color:#17213b}*{box-sizing:border-box}body{margin:0}header{padding:32px 28px 24px;background:#fff;border-bottom:1px solid #e6e9f1}h1{font-size:25px;margin:0 0 5px;letter-spacing:-.7px}p{margin:0;color:#59647d;font-size:14px;line-height:22px}.shell{max-width:1450px;margin:0 auto}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding:24px}.menu{display:grid;gap:10px;align-content:start}.item{background:#fff;border:1px solid #e0e4ee;border-radius:14px;padding:16px;text-align:left;cursor:pointer;color:#17213b;font:inherit}.item.active{border-color:#5949e8;background:#eeedff;box-shadow:0 0 0 1px #5949e8}.item strong{display:block;font-size:14px;margin-bottom:4px}.item span{font-size:12px;line-height:19px;color:#59647d}.viewer{background:#fff;border:1px solid #e0e4ee;border-radius:16px;overflow:hidden}.toolbar{padding:15px 20px;border-bottom:1px solid #e8eaf2;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar strong{font-size:14px}.toolbar a{font-size:13px;text-decoration:none;color:#5949e8;font-weight:650}iframe{width:100%;height:930px;border:none;background:#f7f8fc}.hint{padding:14px 20px;font-size:12px;color:#59647d;border-top:1px solid #e8eaf2}@media(max-width:800px){.layout{display:block;padding:12px}.menu{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}.item{padding:12px}header{padding:22px 16px}iframe{height:950px}}@media(max-width:450px){.menu{grid-template-columns:1fr}}
</style></head><body><header><div class="shell"><h1>Vocelune / Email Design System</h1><p>5 mẫu email HTML responsive · giao diện demo với dữ liệu giả định · không gửi email thực</p></div></header><main class="shell layout"><nav class="menu"><button class="item active" data-mail="welcome"><strong>01. Chào mừng</strong><span>Giới thiệu 3 bước bắt đầu học</span></button><button class="item" data-mail="study-reminder"><strong>02. Nhắc ôn tập</strong><span>Dựa trên số thẻ đến hạn</span></button><button class="item" data-mail="daily-summary"><strong>03. Tổng kết ngày</strong><span>Chỉ số hoạt động và từ đã ôn</span></button><button class="item" data-mail="weekly-digest"><strong>04. Báo cáo tuần</strong><span>Nhịp học và phân bố 7 ngày</span></button><button class="item" data-mail="password-reset"><strong>05. Đặt lại mật khẩu</strong><span>Email bảo mật giao dịch</span></button></nav><section class="viewer"><div class="toolbar"><strong id="heading">Chào mừng</strong><a id="newtab" target="_blank" href="welcome.html" rel="noopener noreferrer">Mở template riêng</a></div><iframe id="frame" src="welcome.html" title="Email template preview"></iframe><div class="hint">Đây là bản xem trước trên trình duyệt. Email thực có thể hiển thị khác nhau giữa Gmail, Outlook và Apple Mail.</div></section></main><script>const items=[...document.querySelectorAll('[data-mail]')],frame=document.querySelector('#frame'),heading=document.querySelector('#heading'),newtab=document.querySelector('#newtab');items.forEach(btn=>btn.addEventListener('click',()=>{items.forEach(x=>x.classList.toggle('active',x===btn));const id=btn.dataset.mail;frame.src=id+'.html';heading.textContent=btn.querySelector('strong').textContent;newtab.href=id+'.html'}));</script></body></html>
